services:
  aegis:
    build: .
    image: aegis-backend
    container_name: aegis-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AEGIS_PUBLIC_HOSTS: ${AEGIS_PUBLIC_HOSTS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  console:
    build: ./frontend
    image: aegis-console
    container_name: aegis-console
    ports:
      - "3000:3000"
    depends_on:
      aegis:
        condition: service_healthy
    restart: unless-stopped
